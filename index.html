<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intel 8080 Emulator & Assembler</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1>Intel 8080 Emulator & Assembler</h1>
            <span class="version-badge">Version 2.1</span>
        </div>
    </header>

    <main>
        <section id="editor-section">
            <h2>Assembler</h2>
            <textarea id="code-editor" spellcheck="false" placeholder="Write your 8080 assembly here...
Example:
FLD0 15
FLD1 25
FADD
HLT"></textarea>
            <div class="controls">
                <button id="btn-assemble">Assemble & Load</button>
                <button id="btn-clear-code" class="btn-clear">Clear Code</button>
            </div>
            <div id="assembler-output"></div>
        </section>

        <section id="emulator-section">
            <h2>CPU Dashboard</h2>
            <div class="controls">
                <button id="btn-run">Run</button>
                <button id="btn-stop">Stop</button>
                <button id="btn-step">Step</button>
                <button id="btn-reset">Reset</button>
                <span id="status-badge">Idle</span>
            </div>

            <div class="cpu-grid">
                <div class="card registers">
                    <h3>Registers</h3>
                    <div class="reg-row">
                        <div class="reg-box"><span>A</span><div id="reg-a">00</div></div>
                        <div class="reg-box"><span>Flags</span><div id="reg-f">02</div></div>
                    </div>
                    <div class="reg-row">
                        <div class="reg-box"><span>B</span><div id="reg-b">00</div></div>
                        <div class="reg-box"><span>C</span><div id="reg-c">00</div></div>
                    </div>
                    <div class="reg-row">
                        <div class="reg-box"><span>D</span><div id="reg-d">00</div></div>
                        <div class="reg-box"><span>E</span><div id="reg-e">00</div></div>
                    </div>
                    <div class="reg-row">
                        <div class="reg-box"><span>H</span><div id="reg-h">00</div></div>
                        <div class="reg-box"><span>L</span><div id="reg-l">00</div></div>
                    </div>
                    <div class="reg-row">
                        <div class="reg-box extended"><span>PC</span><div id="reg-pc">0000</div></div>
                        <div class="reg-box extended"><span>SP</span><div id="reg-sp">FFFF</div></div>
                    </div>
                    <!-- Registros del Coprocesador FPU -->
                    <div class="reg-row">
                        <div class="reg-box extended" style="background-color: #f1f5f9;"><span>FP0</span><div id="reg-fp0">0</div></div>
                        <div class="reg-box extended" style="background-color: #f1f5f9;"><span>FP1</span><div id="reg-fp1">0</div></div>
                    </div>
                </div>

                <div class="dashboard-right">
                    <div class="card flags">
                        <h3>Flags</h3>
                        <div class="flags-row">
                            <div class="flag-box" title="Sign Flag (Signo): Se activa (1) si el bit más significativo (bit 7) del resultado es 1, indicando un número negativo."><span>S</span><div id="flag-s">0</div></div>
                            <div class="flag-box" title="Zero Flag (Cero): Se activa (1) si el resultado de la última operación fue exactamente cero."><span>Z</span><div id="flag-z">0</div></div>
                            <div class="flag-box" title="Auxiliary Carry Flag (Acarreo Auxiliar): Se activa (1) si hay un acarreo del bit 3 al bit 4 en una suma, o si no hay préstamo en una resta. Es utilizado por DAA."><span>AC</span><div id="flag-ac">0</div></div>
                            <div class="flag-box" title="Parity Flag (Paridad): Se activa (1) si el resultado tiene un número par de bits en 1."><span>P</span><div id="flag-p">0</div></div>
                            <div class="flag-box" title="Carry Flag (Acarreo): Se activa (1) si la última operación generó un acarreo (en suma) o un préstamo (en resta) fuera del bit más significativo."><span>CY</span><div id="flag-cy">0</div></div>
                        </div>
                    </div>

                    <div class="card stack">
                        <h3>Stack View (around SP)</h3>
                        <div id="stack-table"></div>
                    </div>
                </div>

                <div class="card memory">
                    <h3>Memory View</h3>
                    <div class="mem-controls">
                        <input type="text" id="mem-start-addr" value="0000" size="4">
                        <button id="btn-mem-go">Go</button>
                    </div>
                    <div id="memory-table"></div>
                </div>
            </div>
        </section>
    </main>

    <script src="cpu.js"></script>
    <script src="assembler.js"></script>
    <script src="main.js"></script>
</body>
</html>
